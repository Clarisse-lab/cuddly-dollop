[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "govdata-connector-pncp"
version = "0.1.0"
description = "Conector do PNCP para govdata-platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["govdata-platform>=0.1.0"]

[project.entry-points."govdata.connectors"]
pncp = "govdata_pncp.connector:PNCPConnector"

[tool.hatch.build.targets.wheel]
packages = ["src/govdata_pncp"]
