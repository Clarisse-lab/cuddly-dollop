[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "govdata-connector-transparencia"
version = "0.1.0"
description = "Conector do Portal da Transparencia para govdata-platform"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["govdata-platform>=0.1.0"]

[project.entry-points."govdata.connectors"]
transparencia = "govdata_transparencia.connector:PortalTransparenciaConnector"

[project.scripts]
govdata-transparencia-sanctions = "govdata_transparencia.sanctions_worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/govdata_transparencia"]
