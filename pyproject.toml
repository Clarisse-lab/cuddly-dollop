[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "govdata-platform"
version = "0.1.0"
description = "Nucleo extensivel para integracao de dados publicos"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Dados Gov Plataforma" }]
dependencies = []

[project.optional-dependencies]
api = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
]
test = ["httpx2>=2,<3"]

[project.scripts]
govdata = "govdata.cli:main"
govdata-api = "govdata.api.app:run"

[project.entry-points."govdata.connectors"]
ibge = "govdata.connectors.ibge:IBGEConnector"

[tool.hatch.build.targets.wheel]
packages = ["src/govdata"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
